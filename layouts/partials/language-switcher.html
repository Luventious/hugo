{{- if gt (len .Site.Languages) 1 -}}
<div class="language-switcher {{ .class }}">
    <button type="button"
            class="language-switcher-btn rounded-md p-2 text-lg text-text-secondary-light transition-colors duration-300 hover:text-text-primary-light dark:text-text-secondary-dark dark:hover:text-text-primary-dark"
            aria-haspopup="true">
        {{ .Language.Lang | upper }}
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m6 9 6 6 6-6"/>
        </svg>
    </button>
    <div class="language-dropdown">
        {{ range .Site.Languages }}
            {{ $translation := "" }}
            {{ $translations := where $.Page.Translations "Lang" .Lang }}
            {{ if $translations }}
                {{ $translation = index $translations 0 }}
            {{ end }}
            <a href="{{ if $translation }}{{ $translation.Permalink }}{{ else }}{{ .Lang | absLangURL }}{{ end }}"
               class="{{ if eq .Lang $.Language.Lang }}language-active {{ end }}text-text-secondary-light transition-colors duration-300 hover:text-text-primary-light dark:text-text-secondary-dark dark:hover:text-text-primary-dark">
                {{ .LanguageName }}
            </a>
        {{ end }}
    </div>
</div>
{{- end -}}
