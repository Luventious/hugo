<!-- Footer -->
<footer class="mt-32 text-center">
    <div class="max-w-3xl mx-auto">
        <div class="border-t border-border-primary-light dark:border-border-primary-dark pt-5">
            <div class="flex flex-col items-center justify-center gap-2">
                {{ $authorData := index site.Data .Language.Lang "author" }}
                {{ $author := cond (and $authorData $authorData.author) $authorData.author site.Params }}
                <p class="text-text-secondary-light dark:text-text-secondary-dark text-sm">© {{ now.Format "2006" }} {{ $author.name }}</p>
                <p class="text-text-secondary-light dark:text-text-secondary-dark text-sm pb-12">部分图片来源于网络，版权归原作者所有。</p>
            </div>
        </div>
    </div>
</footer>
