{{ define "main" }}
<div class="w-full md:w-3/4 lg:w-1/2 mx-auto px-4 py-12">
    <h1 class="text-4xl font-bold mb-8 text-text-primary-light dark:text-text-primary-dark">{{ .Title }}</h1>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        {{ range .Data.Terms.ByCount }}
        <div class="term-card p-6 bg-bg-primary-light dark:bg-bg-secondary-dark border border-border-primary-light dark:border-border-primary-dark">
            <a href="{{ .Page.RelPermalink }}" class="text-xl font-semibold text-text-primary-light dark:text-text-primary-dark hover:text-accent-light dark:hover:text-accent-dark transition-colors">
                {{ .Page.Title }}
            </a>
            <span class="text-text-secondary-light dark:text-text-secondary-dark ml-2">({{ .Count }})</span>
        </div>
        {{ end }}
    </div>
</div>
{{ end }}
