{{ define "main" }}
<div class="w-full md:w-3/4 lg:w-1/2 mx-auto px-4 py-12">
    <div class="space-y-5 max-w-3xl mx-auto">
        {{ range .Pages }}
        <a href="{{ .RelPermalink }}"
           class="group relative flex gap-5 items-stretch rounded-2xl p-5
                  bg-bg-secondary-light dark:bg-bg-secondary-dark
                  border border-transparent transition duration-200
                  hover:-translate-y-1
                  hover:border-border-secondary-light dark:hover:border-border-secondary-dark
                  hover:shadow-xl">

            <!-- 左侧方形封面图（有 cover 才显示） -->
            {{ if .Params.cover }}
            <div class="hidden md:block flex-shrink-0 w-32 h-32 rounded-xl overflow-hidden
                        bg-gray-200 dark:bg-gray-700">
                <img src="{{ .Params.cover }}" alt="{{ .Title }} cover"
                     class="w-full h-full object-cover">
            </div>
            {{ end }}

            <!-- 右侧文本区 -->
            <div class="flex-1 min-w-0 pr-11">
                {{ if .Date }}
                <p class="text-xs uppercase tracking-wider mb-2
                          text-text-tertiary-light dark:text-text-tertiary-dark">
                    {{ .Date.Format "January 2, 2006" }}
                </p>
                {{ end }}

                <h3 class="text-lg font-semibold leading-snug mb-2 break-words
                           text-text-primary-light dark:text-text-primary-dark">
                    {{ .Title }}
                </h3>

                {{ if .Description }}
                <p class="text-sm leading-relaxed mb-3 line-clamp-2
                          text-text-secondary-light dark:text-text-secondary-dark">
                    {{ .Description }}
                </p>
                {{ end }}

                {{ if .Params.tags }}
                <div class="flex flex-wrap gap-2">
                    {{ range .Params.tags }}
                    <span class="px-2.5 py-1 text-xs rounded-full
                                 bg-bg-tertiary-light dark:bg-bg-tertiary-dark
                                 text-text-secondary-light dark:text-text-secondary-dark">
                        {{ . }}
                    </span>
                    {{ end }}
                </div>
                {{ end }}
            </div>

            <!-- 右上角箭头按钮：亮色黑底白箭头，暗色白底黑箭头 -->
            <span class="absolute top-5 right-5 w-9 h-9 rounded-lg
                         bg-neutral-900 text-white
                         dark:bg-white dark:text-neutral-900
                         flex items-center justify-center
                         transition duration-200 group-hover:scale-105">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                     viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M7 17l9.2-9.2M17 17V7H7"/>
                </svg>
            </span>
        </a>
        {{ end }}
    </div>
</div>
{{ end }}
