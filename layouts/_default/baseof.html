<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} - {{ .Site.Title }}{{ end }}</title>

        <!-- Favicon here-->
        <link rel="apple-touch-icon" sizes="180x180" href="{{ .Site.BaseURL }}favicon_io/apple-touch-icon.png">
        <link rel="icon" type="image/png" sizes="32x32" href="{{ .Site.BaseURL }}favicon_io/favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="{{ .Site.BaseURL }}favicon_io/favicon-16x16.png">
        <link rel="manifest" href="{{ .Site.BaseURL }}favicon_io/site.webmanifest">
        <link rel="preload" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css" as="style">

        <style>
            html {
                /* 固定滚动条占位，避免切换页面时内容左右跳动 */
                scrollbar-gutter: stable;
            }
            html, body {
                background-color: #FFFFFF;
                color: #1f2937;
            }
            html.dark, html.dark body {
                background-color: #121212;
                color: #f3f4f6;
            }
        </style>

        <script>
            if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        </script>

        <script src="https://cdn.tailwindcss.com"></script>
        <script>
            // 与 themes/hugo-noir/tailwind.config.js 保持一致。
            // 缺了这段配置，bg-bg-secondary-*、text-text-secondary-*、border-border-primary-*
            // 等自定义色板不会被生成，dark: 变体也只会跟随系统而不是站内开关。
            tailwind.config = {
                darkMode: 'class',
                theme: {
                    extend: {
                        fontFamily: {
                            sans: ['Space Grotesk', 'sans-serif'],
                        },
                        colors: {
                            'bg-primary-light': '#ffffff',
                            'bg-secondary-light': '#ffffff',
                            'bg-tertiary-light': '#f5f5f5',
                            'text-primary-light': '#262626',
                            'text-secondary-light': '#525252',
                            'text-tertiary-light': '#737373',
                            'border-primary-light': '#d4d4d4',
                            'border-secondary-light': '#e5e5e5',
                            'accent-light': '#0284c7',

                            'bg-primary-dark': '#121212',
                            'bg-secondary-dark': '#1a1a1a',
                            'bg-tertiary-dark': '#1a1a1a',
                            'text-primary-dark': '#f5f5f5',
                            'text-secondary-dark': '#a3a3a3',
                            'text-tertiary-dark': '#737373',
                            'border-primary-dark': '#404040',
                            'border-secondary-dark': '#333333',
                            'accent-dark': '#0ea5e9',
                        },
                    },
                },
            };
        </script>
        <link rel="stylesheet" type='text/css' href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css" />
    </head>
    <body class="min-h-screen bg-bg-primary-light dark:bg-bg-primary-dark text-text-primary-light dark:text-text-primary-dark">
        {{ partial "header" . }}
        <main>
            {{ block "main" . }}{{ end }}
        </main>
        {{ partial "footer" . }}
    </body>
</html>
